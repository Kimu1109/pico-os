# 実機ファーム(PlatformIO, env:rpipico2w)をビルドして、実機でしか出ないリンクエラー・
# 多重定義(arduino-pico / pico-sdk 由来のもの)をPRの段階で見つける。
#
#   プルリクエスト / main へのpush … 既定の版と、ハードウェア機能を外した版をビルドする
#   手動実行                       … Actionsタブの「Run workflow」から
#   ほかのワークフローから呼ぶ     … ナイトリービルド(nightly.yml)が同じ成果物をリリースへ載せる
#
# 内蔵アプリを外した版・音楽再生に特化した版・英語の版は重い(各2.5〜3.5分)ので、PRでは作らず
# ナイトリー(nightly.yml の「派生版のビルド」)で作る(2026-11-06)。
#
# PlatformIO の準備(キャッシュ・プラットフォームを maxgerhardt の版へ差し替える・その版の固定)は
# .github/actions/pio-setup にある(ナイトリーの派生版のビルドと共用)。
name: 実機ファームのビルド

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      serial:
        description: ファームの通し番号(git rev-list --count HEAD)
        value: ${{ jobs.build.outputs.serial }}
      short:
        description: 短いコミットのハッシュ
        value: ${{ jobs.build.outputs.short }}

permissions:
  contents: read

# 呼ばれたときの github.workflow は呼び出し元の名前になるので、呼び出し元ごとに別の組になる
# (main へのpushのビルドとナイトリービルドが互いを取り消さない)
concurrency:
  group: firmware-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: rpipico2w をビルドする
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      serial: ${{ steps.version.outputs.serial }}
      short: ${{ steps.version.outputs.short }}
    steps:
      # ファームの版(通し番号 = git rev-list --count HEAD。script/pio/pio_firmware.py)を正しく数えるため、履歴を全部取る
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # script/pio/pio_firmware.py と同じ数え方。ナイトリービルドがリリースの名前に使う
      - name: 版を数える
        id: version
        run: |
          echo "serial=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: PlatformIO を用意する
        uses: ./.github/actions/pio-setup

      # buildcfg/ の版の旗を、PCビルドの読み取り器(pc/cmake/PicoVariant.cmake)が PlatformIO と同じに読めているか
      - name: 版の旗をPCビルドと同じに読めるか
        run: python3 script/check/check_variants.py

      - name: ビルドする
        run: pio run -e rpipico2w

      # フラッシュ/SDに分けた日本語フォント(src/gui/fonts/・pc/sdcard/sys/fonts/)が、今の LovyanGFX と
      # script/codegen/font/base_kanji.txt から作り直したものと同じか(LovyanGFXの版を上げた・残す字を変えたときの作り直し忘れ)
      - name: 分けた日本語フォントが作り直したものと同じか
        run: python3 script/codegen/font/split_font.py --check --lgfx .pio/libdeps/rpipico2w/LovyanGFX/src/lgfx/Fonts/IPA/lgfx_font_japan.c

      # 音声・マイク・電池を外した版(src/config/Hardware_Config.hpp)。空の実装の付け忘れ
      # (Sound_Functions.hpp 等へ足した関数が _Off.cpp に無い)はリンクで初めて分かるので、PRとmainへのpushで作る
      # (ナイトリーから呼ばれたときは作らない。成果物にも載せない)
      - name: ハードウェア機能を外した版をビルドする
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pio run -e rpipico2w_minimal

      # 内蔵アプリを外した版(rpipico2w_lite)・音楽再生に特化した版(rpipico2w_music)・英語の版(rpipico2w_en)は
      # ナイトリー(nightly.yml の「派生版のビルド」)で作る

      # SDに置いて更新する更新ファイル(docs/FIRMWARE_UPDATE.md)。ここでは署名なし
      # (本体は /sys/debug.cfg の fw-allow-unsigned = true のときだけ、確認のうえで受け付ける)。
      # 署名はナイトリー(nightly.yml)がリリースへ載せるときに Secrets の鍵で付ける(PRのビルドには鍵を渡さない)
      - name: 更新ファイル(署名なし)を作る
        run: python3 script/release/firmware_tool.py pack --unsigned --bin .pio/build/rpipico2w/firmware.bin --out .pio/build/rpipico2w/firmware.pfw

      - name: ファームを保存する(動作確認用)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-rpipico2w
          path: |
            .pio/build/rpipico2w/firmware.uf2
            .pio/build/rpipico2w/firmware.elf
            .pio/build/rpipico2w/firmware.pfw
          retention-days: 7
