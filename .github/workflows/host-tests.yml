# ホストテスト(script/host_test/run.sh)と層の決まり(script/check/check_layers.py)をプルリクエストで回す。
#
#   実コードをPCのg++ + ASan/UBSanで動かし、解放漏れ・バッファ越え・未定義動作と
#   各機能の回帰を見る。実機(RP2350)のビルドとは無関係。
#   ビルドは script/host_test/CMakeLists.txt(CMake + CTest)。
#
#   プルリクエスト / main へのpush … 全グループを並列(グループごとに別ジョブ)で回す
#   手動実行                       … Actionsタブの「Run workflow」から
#
# run_net.sh(実通信・OpenSSHのsshd・TLSサーバを使う結合テスト)と
# run_mem.sh(確保回数の計測)は環境依存が強いので、ここでは回さない。
name: ホストテスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ参照への新しいpushで、古い実行は打ち切る
concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 1グループが落ちても残りの結果は見たい
      fail-fast: false
      matrix:
        # run.sh --list(= CMakeLists.txt の HOST_TEST_GROUPS)と同じ並び。
        # グループを足したらここにも足すこと(下の確認ジョブが見張る)
        group: [core, apps, media, input, calc, widget, lua-base, lua-engine, lua-ext, lua-sandbox, lua-scene, lua-apps, ssh]
    steps:
      - uses: actions/checkout@v4

      # g++・make・cmake・ninja・python3・libssl-dev はランナーのイメージに最初から入っているので、
      # apt で入れるのは media グループの pvid_test が使う numpy と ffmpeg(あれば追加の経路を通る)だけ。
      # ffmpeg は依存込みで 80MB あり、apt のミラーが遅いと取得だけで 20 分かかっていたので .deb をキャッシュする
      - name: 依存を入れる(media だけ)
        if: matrix.group == 'media'
        uses: ./.github/actions/apt-cached
        with:
          packages: python3-numpy ffmpeg

      - name: 依存が揃っているかを見る
        run: |
          for c in g++ cmake python3; do command -v "$c" >/dev/null || { echo "::error::$c がありません"; exit 1; }; done
          command -v ninja >/dev/null || echo "::notice::ninja が無いので make でビルドします"
          if [ "${{ matrix.group }}" = media ]; then
            python3 -c 'import numpy' && command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null
          fi

      # 標準のLuaアプリの正本とそのテストは kimu1109/pico-os-apps(docs/design/lua-apps.md「標準Luaアプリの置き場所」)。
      # pico-os を変えて標準アプリが壊れないかを、その main の tests/host/ で見る(アプリ側の変更は向こうのCIが見る)
      - name: pico-os-apps を取る(lua-apps だけ)
        if: matrix.group == 'lua-apps'
        uses: actions/checkout@v4
        with:
          repository: Kimu1109/pico-os-apps
          path: pico-os-apps
          persist-credentials: false

      - name: ホストテストを回す(${{ matrix.group }})
        env:
          PICOOS_APPS_DIR: ${{ matrix.group == 'lua-apps' && format('{0}/pico-os-apps', github.workspace) || '' }}
        run: sh script/host_test/run.sh ${{ matrix.group }}

  # run.sh に足したグループが matrix から漏れていないかを見る
  groups-in-sync:
    name: グループの一覧が揃っているか
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: matrix と run.sh --list を比べる
        run: |
          expected=$(sh script/host_test/run.sh --list | tr ' ' '\n' | sort)
          actual=$(sed -n 's/^ *group: \[\(.*\)\]$/\1/p' .github/workflows/host-tests.yml | tr -d ' ' | tr ',' '\n' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::.github/workflows/host-tests.yml の matrix.group が run.sh --list と食い違っています"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "グループの一覧は揃っています: $(echo $expected)"

  # src/ の層の決まり(下の段から上の段へ #include しない)。決まりは script/check/check_layers.py の先頭
  layers:
    name: 層の決まり
    runs-on: ubuntu-latest
    # apt のミラーが遅いと cairosvg の取得に数分かかることがある(キャッシュに当たれば数秒)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: script/check/check_layers.py
        run: python3 script/check/check_layers.py
      # アイコンの検査(generate_icons.py --check)は SVG を描くのに cairosvg が要る。ランナーのシステムの python3 は
      # pip で入れるのを断る(PEP 668)ので apt の版を使う(noble の 2.7.1 で icons_data.h が同じに作れることを確かめてある)
      - name: 生成物の検査に要るものを入れる
        uses: ./.github/actions/apt-cached
        with:
          packages: python3-cairosvg python3-pil
      # 同梱のLuaモジュール・Wi-Fi転送のページ・表示の訳・JISの表・TLSのルート証明書の一覧・アイコンが、材料から作り直したものと合っているか。
      # フォントの分割は LovyanGFX の本体が要るので firmware-build.yml が別に見る(script/check/check_generated.py --list)
      - name: 生成物が材料と合っているか
        run: python3 script/check/check_generated.py --skip fonts
      # 常用漢字の外の字はSDの追加フォントにしか無い(docs/design/performance.md「漢字の一部をSDへ」)
      - name: 画面の文字がフラッシュの漢字(script/codegen/font/base_kanji.txt)だけで書かれているか
        run: python3 script/codegen/font/check_ui_chars.py
