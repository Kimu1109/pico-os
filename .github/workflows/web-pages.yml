# Webビルド(WebAssembly)をGitHub Pagesへ自動公開する。
#
#   main へのpush      … ビルドして公開する
#   プルリクエスト     … ビルドだけして壊れていないかを見る(公開はしない)
#   手動実行           … Actionsタブの「Run workflow」から
#
# 公開先: https://kimu1109.github.io/pico-os/ (トップは入口のページ。Web版本体は /playground/)
#
# **初回だけ、リポジトリの Settings > Pages で Source を「GitHub Actions」にすること。**
# ワークフローからの自動有効化(configure-pages の enablement)は GITHUB_TOKEN の権限では
# できない("Create Pages site failed: Resource not accessible by integration" で落ちる)。
name: Web を GitHub Pages へ公開

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ここを上げるときは手元でも同じ版で通してから(pc/README.md 参照)
  EMSDK_VERSION: "6.0.9"
  # Lua APIリファレンス(lua-api-doc/)のビルドに使うHugo。上げるときは手元でも同じ版で通してから
  HUGO_VERSION: "0.140.2"

jobs:
  build:
    name: WebAssemblyをビルドする
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # emsdkは1GB近くあるうえ、SDL2のportsのビルド結果も同じ場所に溜まるので丸ごとキャッシュする
      - name: emsdk をキャッシュから戻す
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: emsdk を用意する
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      # 辞書(script/dict/src/en-ja-and-ja-en.tsv + 索引。索引は script/dict/build.sh が作る)はサイズの都合で
      # pc/sdcard/ には常設していない(IME辞書と同じ扱い。pc/README.md参照)。
      # Webビルドは pc/sdcard/ を丸ごと --preload-file で index.data へ焼き込む
      # (pc/CMakeLists.txt参照)ので、ビルド前にここへ置いて初めて辞書アプリが
      # ブラウザ版でも動く。リポジトリ本体の pc/sdcard/ は汚さない
      - name: 辞書をpc/sdcard/へ配置する
        run: |
          sh script/dict/build.sh dict
          mkdir -p pc/sdcard/sys/dict
          cp script/dict/out/sys/dict/en-ja-and-ja-en.tsv script/dict/out/sys/dict/dict_index.tsv pc/sdcard/sys/dict/

      - name: ビルドする
        run: |
          . ~/emsdk/emsdk_env.sh
          emcmake cmake -S pc -B pc/build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICOOS_WEB_REV="${GITHUB_SHA::7}"
          cmake --build pc/build-web -j"$(nproc)"

      # ビルドディレクトリにはCMakeの中間物も入っているので、配るものだけを集める
      - name: 公開するファイルを集める
        run: |
          # Web版本体は /playground/ に置く。トップ(/)は入口のページ(pc/web/landing.html)
          mkdir -p _site/playground
          cp pc/web/landing.html _site/index.html
          # js/wasm/data はリビジョン付きの名前で置く(shell.html の assetRev 参照)。同じ名前のままだと
          # ブラウザが古い index.js と新しい index.data を組み合わせ、SDのファイルの位置がずれて壊れて読める
          rev="${GITHUB_SHA::7}"
          for ext in js wasm data; do
            cp "pc/build-web/index.$ext" "_site/playground/index.$rev.$ext"
          done
          sed -E -e "s/__PICOOS_ASSET_REV__/$rev/g" \
                 -e "s/src=(\"?)index\.js\1/src=\1index.$rev.js\1/" \
              pc/build-web/index.html > _site/playground/index.html
          # 書き換え漏れ(emscripten の出力の形が変わった等)は公開せずに止める
          grep -q "index.$rev.js" _site/playground/index.html
          ! grep -q "__PICOOS_ASSET_REV__" _site/playground/index.html
          ls -laR _site

      # トップのページ(pc/web/landing.html)に載せる画面写真。写真はリポジトリに置かず、
      # 公開のたびにネイティブのPCビルドの --shot で今の画面を撮る(script/web_shots.sh)。
      # PRでも撮って、撮れなくなった(起動しない・落ちる等)ことにここで気づけるようにする
      - name: トップのページの画面写真を撮る
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libssl-dev
          cmake -S pc -B pc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build pc/build -j"$(nproc)"
          sh script/web_shots.sh pc/build/picoos_pc _site/shots

      # アプリストアの配布物(docs/APP_REPO.md)。署名した目録 store/ がコミットされていれば、
      # アプリの中身を pc/sdcard/lua/apps/ から写して /apps/ に置く。署名は手元のPCで済ませてある
      # (build_app_repo.py sign)ので、秘密鍵はここに要らない。署名の後で中身が変わったアプリは
      # 警告して配らない(sign をやり直すまで)
      - name: アプリストアの配布物を集める
        run: |
          if [ -f store/catalog.tsv ]; then
            python3 script/build_app_repo.py assemble --index store --out _site/apps --allow-stale
            python3 script/build_app_repo.py verify --dir _site/apps
          else
            echo "store/catalog.tsv が無いので、アプリストアの配布物は置きません"
          fi

      # Lua APIリファレンス(lua-api-doc/ のHugoサイト)を /lua-api/ に置く。
      # baseURL はサブパス配信用にここで上書きする(hugo.toml は "/" のまま、手元の確認用)。
      # PRでもビルドして、文書の壊れ(テンプレートの誤り等)をここで止める
      - name: Lua APIリファレンスをビルドする
        run: |
          curl -sSL -o /tmp/hugo.tgz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          /tmp/hugo --source lua-api-doc --destination "$GITHUB_WORKSPACE/_site/lua-api" \
            --baseURL "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/lua-api/" \
            --minify
          test -f _site/lua-api/index.html

      - name: 成果物をアップロードする
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: GitHub Pages へ公開する
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write      # 公開そのもの
      id-token: write   # deploy-pages が使うOIDCトークン

    # 公開は同時に1つだけ。走っている公開は最後まで終わらせる(中断すると中途半端に配られる)
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Pagesの設定を読む。未設定ならここで落ちるので、原因がすぐ分かる
      # (enablement: true での自動有効化はトークンの権限不足でできないため付けない)
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
