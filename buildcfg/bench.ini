; 実機で速さを比べるためだけの版(platformio.ini の extra_configs から読む)。配らない(CI・ナイトリーでは作らない)。
; 既定の版との違いはRAMの置き方だけ(docs/design/performance.md「よく通る所をRAMに置く」)。

; Luaの命令を実行する本体もRAMへ置く
[env:rpipico2w_lua_ram]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_lua_vm_in_ram.flags}

; 既定でRAMへ置いている文字を描く道もフラッシュへ戻す(何もRAMへ置かない)
[env:rpipico2w_no_ram]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_no_hot_in_ram.flags}
