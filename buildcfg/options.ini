; ビルドの部品(platformio.ini の extra_configs から読む)。
; ここの節は `env:` で始まらないのでビルドされない。版(variants.ini / bench.ini)が
;   build_flags =
;       ${env:rpipico2w.build_flags}
;       ${opt_xxx.flags}
; のように足して使う(build_flags は extends で継いでも足し合わされず上書きされるため、${…} で展開する)。
; 部品を足すときは「1つの軸の1つの選択」にとどめ、組み合わせは variants.ini に書く。
; 旗の意味と既定値は src/config/ の各ヘッダ。PCビルドの同じ指定は pc/CMakeLists.txt の option。
; flags には -DNAME[=VAL] だけを書く(${…} を入れ子にしない。PCビルドの読み取り器 pc/cmake/PicoVariant.cmake が読む)。

; ---- ハード: 液晶(src/consts.hpp の SCREEN_WIDTH/HEIGHT、src/board/LGFX_Config.hpp の PICO_PANEL_*) ----
; 画面の大きさはパネルの縦向きの大きさと合わせる。PCは cmake -DPICOOS_SCREEN_W=320 -DPICOOS_SCREEN_H=480
[opt_screen_320x480]
flags =
    -DSCREEN_WIDTH=320
    -DSCREEN_HEIGHT=480
    -DPICO_PANEL_ST7796

; ---- ハード: 載せる部品(src/config/Hardware_Config.hpp の PICO_HW_*。既定は全部 1=載せる) ----
; 外すと空の実装(hal/Xxx_Functions_Off.cpp)に替わる。液晶・タッチ・SDは外せない。PCは cmake -DPICOOS_HW_SOUND=OFF 等
[opt_no_sound]
flags = -DPICO_HW_SOUND=0
[opt_no_mic]
flags = -DPICO_HW_MIC=0
[opt_no_battery]
flags = -DPICO_HW_BATTERY=0
; 24bitの音声出力を載せる(既定は16bitだけ。src/config/Hardware_Config.hpp の PICO_HW_SOUND_24BIT)。鳴らす深さは実行時に選ぶ
[opt_sound_24bit]
flags = -DPICO_HW_SOUND_24BIT=1

; ---- 機能: 内蔵アプリ(src/config/App_Config.hpp の PICO_APP_*。既定は全部 1=載せる) ----
; ミュージックとストア以外の、選べる内蔵アプリを全部外す(ミュージック・ストアは下の個別の部品で外す)。
; 設定・ファイル・時計・通知・USBドライブ・本体の更新は選べない。PCは cmake -DPICOOS_APP_GB=OFF 等
[opt_apps_minimal]
flags =
    -DPICO_APP_BROWSER=0
    -DPICO_APP_CALCULATOR=0
    -DPICO_APP_CALENDAR=0
    -DPICO_APP_CHAT=0
    -DPICO_APP_DICT=0
    -DPICO_APP_GB=0
    -DPICO_APP_MAIL=0
    -DPICO_APP_NOTES=0
    -DPICO_APP_READER=0
    -DPICO_APP_SSH=0
    -DPICO_APP_TEXTEDITOR=0
    -DPICO_APP_TODO=0
    -DPICO_APP_VIDEO=0
[opt_no_app_music]
flags = -DPICO_APP_MUSIC=0
[opt_no_app_store]
flags = -DPICO_APP_STORE=0

; ---- 機能: Lua(src/config/App_Config.hpp の PICO_LUA_ISO) ----
; Luaの2.5Dエンジン(pico.iso)を外す。PCは cmake -DPICOOS_LUA_ISO=OFF
[opt_no_lua_iso]
flags = -DPICO_LUA_ISO=0

; ---- 機能: 表示言語(src/config/Lang_Config.hpp の PICO_LANG_EN。docs/design/i18n.md「ビルド時に選ぶ言語」) ----
; ビルドごとに1つだけ(既定は日本語)。PCは cmake -DPICOOS_LANG_EN=ON
[opt_lang_en]
flags = -DPICO_LANG_EN=1

; ---- 速さ: よく通る所をRAMに置く(src/config/Ram_Func.hpp・lib/lua/pico/lua_pico_ram.h。docs/design/performance.md「よく通る所をRAMに置く」) ----
; Luaの命令を実行する本体(luaV_execute、約10.5KB)もRAMへ置く(ヒープが約10.5KB減る)
[opt_lua_vm_in_ram]
flags = -DPICO_LUA_VM_IN_RAM=1
; 既定でRAMへ置いている文字を描く道(約1.7KB)もフラッシュへ戻す
[opt_no_hot_in_ram]
flags = -DPICO_HOT_IN_RAM=0
