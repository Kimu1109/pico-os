; 配る版(platformio.ini の extra_configs から読む)。土台 env:rpipico2w に部品(options.ini)を足しただけにする。
; `pio run -e <名前>`。PRで作るのは rpipico2w と rpipico2w_minimal、残りはナイトリー(.github/workflows)。
; env の名前はファームに埋め込まれ、Webの版の一覧が同じ構成を選ぶのに使うので変えないこと。
; ファームの更新(.pfw)は版を区別しないので、構成の違う本体へ送ると画面・機能・言語が変わることに注意。
; PCビルドは同じ名前で cmake -DPICOOS_VARIANT=rpipico2w_music 等と選ぶと、このファイルと options.ini を読んで同じ旗を使う
; (pc/cmake/PicoVariant.cmake)。そのため版と部品の書き方は「${env:rpipico2w.build_flags}・${opt_xxx.flags}・-DNAME[=VAL] だけ」に
; とどめる(外れると script/check/check_variants.py と CMake が止まる)。

; 320x480の液晶(ST7796)向け。配線(ピン)は既定の版と同じ
[env:rpipico2w_320x480]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_screen_320x480.flags}

; 音声出力・マイク・電池を載せない版。アプリの一覧・設定・ステータスバーからも消え、2コア目も起こさない。
; 要るものだけ外した版は、下の部品のうち要るものだけを並べて足せばよい
[env:rpipico2w_minimal]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_no_sound.flags}
    ${opt_no_mic.flags}
    ${opt_no_battery.flags}

; 選べる内蔵アプリを全部外した版。外したアプリはアプリの一覧・バックグラウンドの仕事・ホーム画面のウィジェット・
; ファイルからの関連付けから消え、どこからも呼ばれなくなった中身はリンカが捨てる
[env:rpipico2w_lite]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_apps_minimal.flags}
    ${opt_no_app_music.flags}
    ${opt_no_app_store.flags}

; 音楽再生に特化した版(docs/design/devtools.md「音楽再生に特化した版」)。
; ミュージックとLua(ストア・Luaアプリ)を残し、ほかの内蔵アプリ・マイク・ゲームボーイの音源・pico.iso を外す。
; 曲はWi-Fi転送かUSBドライブで送り込む。24bitの音声出力を載せる(鳴らす深さは設定の「ビット深度」で選ぶ。既定は16bit)
[env:rpipico2w_music]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_no_mic.flags}
    ${opt_apps_minimal.flags}
    ${opt_no_lua_iso.flags}
    ${opt_sound_24bit.flags}

; 英語の版。TR() の日本語の原文はフラッシュに入らない(フォント・かな漢字変換は残るので日本語の表示・入力はできる)
[env:rpipico2w_en]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    ${opt_lang_en.flags}
