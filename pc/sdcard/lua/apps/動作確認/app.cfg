name=動作確認
id=api-test
description=Lua APIの動作確認をまとめたアプリ。部品・描画・画面の受け渡し・コントローラー・音・通知・マイクを1画面ずつ試せる
version=1.0.0
icon=icon.pimg
permission_network=false
permission_sd_outside_app_dir=false
permission_notify=true
# マイクのページ(mic.lua)で聞く・録音する
permission_microphone=true
# 閉じている間も60秒ごとに background.lua を動かす(通知のページの「BG通知」)
permission_background=true
background=background.lua
background_interval=60
