# Wi-Fi設定(旧形式)。
# 保存済みのWi-Fiネットワークは /sys/wifi.cfg(設定アプリの「Wi-Fi」タブが書く)が持つ。
# wifi.cfgがまだ無いときだけ、ここの1組を保存済みネットワークの1番として取り込み、
# wifi.cfgを作る(以後この2キーは読まない)。PCでは実際にSSIDへ接続しに行かないので値は表示用。
wifi-ssid=picoos-pc
wifi-password=dummy

ntp-server-1=ntp.nict.jp
ntp-server-2=time.google.com

# Markdownブラウザのホーム。ここを設定すると、アプリを開いたときにこのURLを取りに行く。
# 設定しなければ同梱のサンプル(/tmp/doc.md)を開く。
#
# 手元で試すには、別の端末で参照実装サーバを立ててから picoos_pc を起動する:
#   python3 script/reference_server.py --root examples --port 8080 --home /doc.md
#browser-home=http://127.0.0.1:8080/doc.md

# 時刻はPCのOSの時計をそのまま使う(NTP同期は行わない)。
# 表示するタイムゾーンだけここで決める
timezone=JST-9

# ---- ここから下はPCビルド専用(実機のパーサは知らないキーを無視する) ----

# auto           … 母艦にインターネットへの経路があるかで接続/切断を決める(既定)
# connected      … 常に接続
# disconnected   … 常に切断
# ssid-not-found … SSIDが見つからない状態を再現
# failed         … 接続失敗を再現
pc-wifi-state=auto

# 電波強度(dBm)。ステータスバーのアイコンの本数がこれで決まる
#   >= -50 … 4本 / >= -65 … 3本 / >= -80 … 2本 / それ未満 … 1本
pc-wifi-rssi=-55

# WiFi.SSID()が返す名前。この行が無ければ上の wifi-ssid の値がそのまま使われる
#pc-wifi-ssid=my-network

# スキャンで返す一覧("SSID:RSSI"のカンマ区切り)
pc-wifi-scan=picoos-pc:-45,guest-network:-68,far-away-ap:-84
