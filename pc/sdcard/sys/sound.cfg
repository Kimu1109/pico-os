# 音声出力の設定(SoundFunctions)。ファイルごと無くてもよい(既定値で動く)
#
# output = auto … アンプ(MAX98357A)が刺さっていれば鳴らす(既定)
# output = off  … 刺さっていても鳴らさない(消音)
output = auto
# 音量 0〜100(既定50)
volume = 50

# --- PCビルド専用 ---
# アンプの有無の代わりに何を見るか。環境変数 PICOOS_SOUND_STATE が優先
#   auto         … 音声デバイスを開けたら「刺さっている」(既定)
#   connected    … 常に刺さっている
#   disconnected … 常に外れている
pc-sound-state = auto
