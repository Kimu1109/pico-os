; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; ビルドの構成は3段に分けてある(docs/design/devtools.md「ビルドの構成の置き場所」)。
;   このファイル            … 土台(env:rpipico2w)。どの版もこれを継ぐ
;   buildcfg/options.ini    … 部品(opt_*)。単独ではビルドされない旗のまとまり
;   buildcfg/variants.ini   … 配る版(部品を土台に足したもの)。CI・ナイトリーで作る
;   buildcfg/bench.ini      … 実機で速さを比べるためだけの版。配らない
;
; 土台はこのファイルから動かさないこと: pc/CMakeLists.txt が lib_deps の LovyanGFX の行を読み、
; CI(.github/actions/pio-setup)が `platform = raspberrypi` の行を書き換え、このファイルをキャッシュのキーにしている。
; そのため lib_deps と platform は buildcfg/ 側で上書きしない。
; env の名前はファームに埋め込まれ、Webの版の一覧が同じ構成の版を選ぶのに使う(Fw_Version.hpp)。名前は変えないこと。

[platformio]
; 引数なしの `pio run` は既定の画面(240x320・ILI9341)だけを作る
default_envs = rpipico2w
extra_configs =
    buildcfg/options.ini
    buildcfg/variants.ini
    buildcfg/bench.ini

[env:rpipico2w]
platform = raspberrypi
board = rpipico2w
framework = arduino

; 内蔵フラッシュ(4MB)のうち、ファームの更新(docs/FIRMWARE_UPDATE.md)の置き場にするLittleFSの大きさ。
; 更新ファイルの中身は firmware.bin を gzip したもの(今は約67%)で、arduino-picoのOTAのローダーが
; 次の起動でここから本体へ写す。ファームの上限は 4MB - 4KB(EEPROM) - これ。
; 1664k だとファームは約2.36MBまで、gzipは約1.59MBまで置ける(2026-10-16のファームは約1.95MB)。
; 2026-10-31にファームが1728k時の上限(約2.31MB)を超えたため、1728k→1664kへ縮めて上限を64KB広げた(要USB書き込み)。
; **変えるとLittleFSの位置が変わるので、変えた版はUSBで書き込むこと**(更新ファイルは今のファームと
; 同じ割り当てでなければ断る)。
board_build.filesystem_size = 1664k

; ファームの版(git rev-list --count HEAD 等)を埋め込み、更新ファイルを作る/送るターゲット(fwpack/fwpush)を足す。
; pio_hot_o2.py は速さの効く少しのファイル(Luaの命令の実行等)だけを -O2 でコンパイルする(-DPICO_HOT_O2=0 で全部 -Os)
extra_scripts =
    pre:script/pio/pio_firmware.py
    pre:script/pio/pio_hot_o2.py
    post:script/pio/pio_firmware_targets.py

monitor_speed = 115200
monitor_encoding = UTF-8

; LovyanGFXの版はここが唯一の情報源。pc/CMakeLists.txt がこの行を読んで
; 同じタグを取得するので、PCビルドと実機ビルドが必ず同じ版になる。
; 範囲指定(^1.2.26 等)だと「実際に落ちてくる版」が確定せずPC側と食い違うため、
; 完全固定にしてある(範囲指定に戻すとPCビルドのcmakeがその旨を出して止まる)。
; Luaはここに載せず lib/lua/ へvendorしてある(lib/lua/README-pico-os.md)。
lib_deps =
    lovyan03/LovyanGFX@1.2.28
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; このツールチェインの limits.h は C++ から LLONG_MAX 等を定義しないので、Lua の判定(luaconf.h)が通るよう補う。
; 括弧はシェルを通ると壊れるので付けていない。理由と確かめたことは lib/lua/README-pico-os.md「LLONG_MAX を補う旗」。
; 派生の版は build_flags を丸ごと上書きするので、必ず ${env:rpipico2w.build_flags} を先頭に書くこと。
build_flags =
    -DLLONG_MAX=__LONG_LONG_MAX__
    -DLLONG_MIN=-__LONG_LONG_MAX__-1
    -DULLONG_MAX=__LONG_LONG_MAX__*2ULL+1ULL
