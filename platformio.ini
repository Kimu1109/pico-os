; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2w]
platform = raspberrypi
board = rpipico2w
framework = arduino

; 内蔵フラッシュ(4MB)のうち、ファームの更新(docs/FIRMWARE_UPDATE.md)の置き場にするLittleFSの大きさ。
; 更新ファイルの中身は firmware.bin を gzip したもの(今は約67%)で、arduino-picoのOTAのローダーが
; 次の起動でここから本体へ写す。ファームの上限は 4MB - 4KB(EEPROM) - これ。
; 1728k だとファームは約2.31MBまで、gzipは約1.66MBまで置けて、つり合う(2026-10-16のファームは約1.95MB)。
; **変えるとLittleFSの位置が変わるので、変えた版はUSBで書き込むこと**(更新ファイルは今のファームと
; 同じ割り当てでなければ断る)。
board_build.filesystem_size = 1728k

; ファームの版(git rev-list --count HEAD 等)を埋め込み、更新ファイルを作る/送るターゲット(fwpack/fwpush)を足す
extra_scripts =
    pre:script/pio_firmware.py
    post:script/pio_firmware_targets.py

monitor_speed = 115200
monitor_encoding = UTF-8

; LovyanGFXの版はここが唯一の情報源。pc/CMakeLists.txt がこの行を読んで
; 同じタグを取得するので、PCビルドと実機ビルドが必ず同じ版になる。
; 範囲指定(^1.2.26 等)だと「実際に落ちてくる版」が確定せずPC側と食い違うため、
; 完全固定にしてある(範囲指定に戻すとPCビルドのcmakeがその旨を出して止まる)。
lib_deps =
    lovyan03/LovyanGFX@1.2.28
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; Luaはここには載らない。lib_depsで生のtarball/gitを指定すると、Lua本体のsrc/に
; main()を持つlua.c/luac.cが混在しているため、Arduinoコア自身のmain()と衝突する。
; 代わりに lib/lua/ へその2ファイルを除いてvendorしてあり、PlatformIOの
; 「プロジェクト専用ライブラリ」(lib/配下)として自動的にビルドされる
; (lib_depsへの追記は不要。詳細は lib/lua/README-pico-os.md 参照)。
; pc/CMakeLists.txtも同じ lib/lua/src/ を参照するので、二重管理にはならない。

; このツールチェイン(arm-none-eabi-gcc同梱のlimits.h)は、LLONG_MAX等を
; 「#if defined(__STDC_VERSION__) && __STDC_VERSION__ >= 199901L」でしか
; 定義しない。__STDC_VERSION__はCコンパイル時のみ定義される規格マクロで、
; g++(C++)でコンパイルされるlua.h/luaconf.h(.cppからincludeされる側)からは
; 常に「未定義」に見えてしまい、Luaの「long longを使えるか」判定(luaconf.h)が
; 失敗してビルドが#errorで止まる。PC/Webビルド(gcc/clang)のlimits.hはC++でも
; 正しくLLONG_MAXを定義するため、この問題は実機ビルド固有。
; vendorしたLua本体(lib/lua/src)は無改造の方針(lib/lua/README-pico-os.md)なので、
; コンパイラが常に持っている__LONG_LONG_MAX__(C/C++問わず定義される非標準マクロ)を
; 使って、標準マクロ側を明示的に補ってやる。
; 括弧で囲みたいところだが、PlatformIOのビルドコマンドは内部でシェル経由になっており
; "(" ")" を渡すと「sh: Syntax error」でビルドそのものが落ちる。括弧を外しても、
; lib/lua/src内でLLONG_MIN/ULLONG_MAXが使われる箇所は代入・比較・シフト演算のみ
; (演算子の優先順位上、括弧が無くても同じ意味になる)であることを実際に
; lib/lua/src全ファイルをこの定義でコンパイルして確認済みなので、括弧無しにしてある。
build_flags =
    -DLLONG_MAX=__LONG_LONG_MAX__
    -DLLONG_MIN=-__LONG_LONG_MAX__-1
    -DULLONG_MAX=__LONG_LONG_MAX__*2ULL+1ULL