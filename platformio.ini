; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2w]
platform = raspberrypi
board = rpipico2w
framework = arduino

monitor_speed = 115200
monitor_encoding = UTF-8

; LovyanGFXの版はここが唯一の情報源。pc/CMakeLists.txt がこの行を読んで
; 同じタグを取得するので、PCビルドと実機ビルドが必ず同じ版になる。
; 範囲指定(^1.2.26 等)だと「実際に落ちてくる版」が確定せずPC側と食い違うため、
; 完全固定にしてある(範囲指定に戻すとPCビルドのcmakeがその旨を出して止まる)。
lib_deps =
    lovyan03/LovyanGFX@1.2.28
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; Luaはここには載らない。lib_depsで生のtarball/gitを指定すると、Lua本体のsrc/に
; main()を持つlua.c/luac.cが混在しているため、Arduinoコア自身のmain()と衝突する。
; 代わりに lib/lua/ へその2ファイルを除いてvendorしてあり、PlatformIOの
; 「プロジェクト専用ライブラリ」(lib/配下)として自動的にビルドされる
; (lib_depsへの追記は不要。詳細は lib/lua/README-pico-os.md 参照)。
; pc/CMakeLists.txtも同じ lib/lua/src/ を参照するので、二重管理にはならない。