; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 引数なしの `pio run` は既定の画面(240x320・ILI9341)だけを作る
default_envs = rpipico2w

[env:rpipico2w]
platform = raspberrypi
board = rpipico2w
framework = arduino

; 内蔵フラッシュ(4MB)のうち、ファームの更新(docs/FIRMWARE_UPDATE.md)の置き場にするLittleFSの大きさ。
; 更新ファイルの中身は firmware.bin を gzip したもの(今は約67%)で、arduino-picoのOTAのローダーが
; 次の起動でここから本体へ写す。ファームの上限は 4MB - 4KB(EEPROM) - これ。
; 1664k だとファームは約2.36MBまで、gzipは約1.59MBまで置ける(2026-10-16のファームは約1.95MB)。
; 2026-10-31にファームが1728k時の上限(約2.31MB)を超えたため、1728k→1664kへ縮めて上限を64KB広げた(要USB書き込み)。
; **変えるとLittleFSの位置が変わるので、変えた版はUSBで書き込むこと**(更新ファイルは今のファームと
; 同じ割り当てでなければ断る)。
board_build.filesystem_size = 1664k

; ファームの版(git rev-list --count HEAD 等)を埋め込み、更新ファイルを作る/送るターゲット(fwpack/fwpush)を足す
extra_scripts =
    pre:script/pio_firmware.py
    post:script/pio_firmware_targets.py

monitor_speed = 115200
monitor_encoding = UTF-8

; LovyanGFXの版はここが唯一の情報源。pc/CMakeLists.txt がこの行を読んで
; 同じタグを取得するので、PCビルドと実機ビルドが必ず同じ版になる。
; 範囲指定(^1.2.26 等)だと「実際に落ちてくる版」が確定せずPC側と食い違うため、
; 完全固定にしてある(範囲指定に戻すとPCビルドのcmakeがその旨を出して止まる)。
lib_deps =
    lovyan03/LovyanGFX@1.2.28
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; Luaはここには載らない。lib_depsで生のtarball/gitを指定すると、Lua本体のsrc/に
; main()を持つlua.c/luac.cが混在しているため、Arduinoコア自身のmain()と衝突する。
; 代わりに lib/lua/ へその2ファイルを除いてvendorしてあり、PlatformIOの
; 「プロジェクト専用ライブラリ」(lib/配下)として自動的にビルドされる
; (lib_depsへの追記は不要。詳細は lib/lua/README-pico-os.md 参照)。
; pc/CMakeLists.txtも同じ lib/lua/src/ を参照するので、二重管理にはならない。

; このツールチェイン(arm-none-eabi-gcc同梱のlimits.h)は、LLONG_MAX等を
; 「#if defined(__STDC_VERSION__) && __STDC_VERSION__ >= 199901L」でしか
; 定義しない。__STDC_VERSION__はCコンパイル時のみ定義される規格マクロで、
; g++(C++)でコンパイルされるlua.h/luaconf.h(.cppからincludeされる側)からは
; 常に「未定義」に見えてしまい、Luaの「long longを使えるか」判定(luaconf.h)が
; 失敗してビルドが#errorで止まる。PC/Webビルド(gcc/clang)のlimits.hはC++でも
; 正しくLLONG_MAXを定義するため、この問題は実機ビルド固有。
; vendorしたLua本体(lib/lua/src)は無改造の方針(lib/lua/README-pico-os.md)なので、
; コンパイラが常に持っている__LONG_LONG_MAX__(C/C++問わず定義される非標準マクロ)を
; 使って、標準マクロ側を明示的に補ってやる。
; 括弧で囲みたいところだが、PlatformIOのビルドコマンドは内部でシェル経由になっており
; "(" ")" を渡すと「sh: Syntax error」でビルドそのものが落ちる。括弧を外しても、
; lib/lua/src内でLLONG_MIN/ULLONG_MAXが使われる箇所は代入・比較・シフト演算のみ
; (演算子の優先順位上、括弧が無くても同じ意味になる)であることを実際に
; lib/lua/src全ファイルをこの定義でコンパイルして確認済みなので、括弧無しにしてある。
build_flags =
    -DLLONG_MAX=__LONG_LONG_MAX__
    -DLLONG_MIN=-__LONG_LONG_MAX__-1
    -DULLONG_MAX=__LONG_LONG_MAX__*2ULL+1ULL

; 画面の大きさ・液晶の種類を変えた版の例(src/consts.hpp の SCREEN_WIDTH/HEIGHT、src/config/LGFX_Config.hpp の PICO_PANEL_*)。
; `pio run -e rpipico2w_320x480`。配線(ピン)は既定の版と同じ。PCビルドでは
; cmake -DPICOOS_SCREEN_W=320 -DPICOOS_SCREEN_H=480 で同じ大きさを確かめられる。
; ファームの更新(.pfw)は版を区別しないので、画面の違う本体へ送らないこと。
[env:rpipico2w_320x480]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    -DSCREEN_WIDTH=320
    -DSCREEN_HEIGHT=480
    -DPICO_PANEL_ST7796

; 音声出力・マイク・電池を載せない版の例(src/config/Hardware_Config.hpp の PICO_HW_*。既定は全部 1=載せる)。
; `pio run -e rpipico2w_minimal`。載せない機能は空の実装(hal/Xxx_Functions_Off.cpp)に替わり、
; アプリの一覧・設定・ステータスバーからも消える。音声もマイクも無いので2コア目も起こさない。
; 必要なものだけ 0 にした env を同じ形で足せばよい(液晶・タッチ・SDは選べない)。PCビルドは
; cmake -DPICOOS_HW_SOUND=OFF -DPICOOS_HW_MIC=OFF -DPICOOS_HW_BATTERY=OFF。
; ファームの更新(.pfw)は版を区別しないので、載せる機能の違う本体へ送ると、その機能が消える/増えることに注意。
[env:rpipico2w_minimal]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    -DPICO_HW_SOUND=0
    -DPICO_HW_MIC=0
    -DPICO_HW_BATTERY=0

; 内蔵アプリを外した版の例(src/config/App_Config.hpp の PICO_APP_*。既定は全部 1=載せる)。
; `pio run -e rpipico2w_lite`。外したアプリはアプリの一覧・バックグラウンドの仕事・ホーム画面のウィジェット・
; ファイルからの関連付けから消え、どこからも呼ばれなくなった中身はリンカが捨てる。
; 要らないものだけ 0 にした env を同じ形で足せばよい(設定・ファイル・時計・通知・USBドライブ・本体の更新は選べない)。
; PCビルドは cmake -DPICOOS_APP_GB=OFF 等。ここでは選べるものを全部外してある。
[env:rpipico2w_lite]
extends = env:rpipico2w
build_flags =
    ${env:rpipico2w.build_flags}
    -DPICO_APP_BROWSER=0
    -DPICO_APP_CALCULATOR=0
    -DPICO_APP_CALENDAR=0
    -DPICO_APP_CHAT=0
    -DPICO_APP_DICT=0
    -DPICO_APP_GB=0
    -DPICO_APP_MAIL=0
    -DPICO_APP_MUSIC=0
    -DPICO_APP_NOTES=0
    -DPICO_APP_READER=0
    -DPICO_APP_SSH=0
    -DPICO_APP_STORE=0
    -DPICO_APP_TEXTEDITOR=0
    -DPICO_APP_TODO=0
    -DPICO_APP_VIDEO=0
