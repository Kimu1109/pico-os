  <path d="M6 3a2 2 0 0 1 4 0v4a2 2 0 0 1-4 0z" />
  <path d="M3 6h1v4h1v1h6v-1h1V6h1v4.5c0 1-1 1.5-2 1.5H9v2h2v1H5v-1h2v-2H5c-1 0-2-.5-2-1.5z" />
