<!--
  pico-os 自作アイコン: マイク(録音)

  tablerのmicrophoneは24pxグリッドの細線で16pxでは崩れる(頭と支えがくっつく)ので、
  16pxグリッドに載る塗りで描き起こした。
  頭  : x=6..10 / y=1..9 の角の丸い縦長
  支え: 頭との間を1px空けたU字(x=3..13 / y=6..12)、軸(x=7..9 / y=12..14)、台(x=5..11 / y=14..15)
-->
