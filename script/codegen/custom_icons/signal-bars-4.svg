<!--
  pico-os 自作アイコン: 電波強度 4/4

  tablerのwifi/antenna-barsは24pxグリッド・stroke-width 2で描かれているため、
  16pxへ落とすと棒の位置が非整数になり太さがバラつく。
  (wifi-0に至っては16pxで0ピクセルになり、完全に消える)
  ステータスバーは16pxなので、最初から16pxグリッドに載るよう塗り矩形で描き起こした。

  棒   : x=1,5,9,13 / 幅2 / 下端y=15 / 高さ4,7,10,13
  ドット: 非アクティブな棒は足元の2x2。「4本中何本目か」を読めるようにするため。
          棒の最小値を4にしてあるのは、3だとドットとの差が1pxしかなく
          lv1が「ドット4つ」に見えてしまうため。

  viewBoxが16なので32/48/64pxへは整数倍拡大になり、どのサイズでも崩れない。
  角丸(rx)は16pxでは結果が変わらず、24pxでドットが潰れるため入れていない。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
  <rect x="1" y="11" width="2" height="4" />
  <rect x="5" y="8" width="2" height="7" />
  <rect x="9" y="5" width="2" height="10" />
  <rect x="13" y="2" width="2" height="13" />
</svg>
