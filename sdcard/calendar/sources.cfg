# カレンダーの取得元。1行1件で「名前 = URL」と書く。
# 取ってきたものは /calendar/<名前>.ics に置かれ、カレンダーアプリが他の .ics と一緒に表示する。
#
#   - 名前はファイル名になるので英数字と _ - だけ(20文字まで)
#   - URLは https:// / http:// / webcal://(= https://)
#   - Googleカレンダー: 設定 → 対象のカレンダー → 「iCal 形式の非公開URL」をそのまま貼る
#     (非公開URLは合言葉と同じなので、このファイルを人に渡さないこと)
#   - 焼き込みのルート証明書に無い相手(自己署名の自前サーバ等)は /sys/tls/ca.pem に足す
#
# 例:
# family = https://calendar.google.com/calendar/ical/xxxx%40group.calendar.google.com/private-0123456789abcdef/basic.ics
