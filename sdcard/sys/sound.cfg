# 音声出力の設定(SoundFunctions)。ファイルごと無くてもよい(既定値で動く)
#
# output = auto … アンプ(MAX98357A)が刺さっていれば鳴らす(既定)
# output = off  … 刺さっていても鳴らさない(消音)
output = auto
# 音量 0〜100(既定50)。スピーカー(MAX98357A)のとき
volume = 50
# イヤホン(PCM5102A)のときの音量 0〜100(既定25)
# hp-volume = 25
# 出力先(設定アプリの「本体」→「出力先」)
#   auto      … イヤホンが差してあればイヤホン、無ければスピーカー(既定)
#   speaker   … 常にスピーカー
#   headphone … 常にイヤホン(差し込み検出を配線していないとき用)
# route = auto
# 出力の周波数 22050(既定。計算が軽い)/ 44100(ライン出力のDAC PCM5102A等向け)。設定アプリの「本体」→「音質」
# sample-rate = 22050
# 電池駆動中に音量を20%で頭打ちする(MAX98357Aの音割れ対策。既定true)。イヤホンへ鳴らしている間は掛けない。
# スピーカーの代わりにライン出力のDACだけをつないでいるなら false でよい
# battery-cap = true

# --- PCビルド専用 ---
# アンプの有無の代わりに何を見るか。環境変数 PICOOS_SOUND_STATE が優先
#   auto         … 音声デバイスを開けたら「刺さっている」(既定)
#   connected    … 常に刺さっている
#   disconnected … 常に外れている
pc-sound-state = auto
