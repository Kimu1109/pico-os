# pico-os チャットサーバを Apache 2.4 の後ろに置き、https://example.com/chat/ として公開する設定の例。
# 手順は server/chat/README.md「Apache の後ろに置いて外から使う」。
#
# 使うモジュール:  sudo a2enmod proxy proxy_http headers
# 置き方(どちらか):
#   - 既にある https の VirtualHost(<VirtualHost *:443>)の中へ、下の「ここから」〜「ここまで」を貼る
#   - /etc/apache2/conf-available/pico-chat.conf として置き、sudo a2enconf pico-chat
#     (この場合は全部の VirtualHost に効く。http の方は certbot --apache 等で https へ転送しておくこと)
# 直したら:  sudo apachectl configtest && sudo systemctl reload apache2
#
# パスを /chat 以外にするなら、ここの /chat と pico-chat.service の --base-path を両方直す。

# ---- ここから ----

# /chat だけで来たら /chat/ へ(Web の画面は相対のパスで API を叩くため)
RedirectMatch 301 ^/chat$ /chat/

<Location /chat/>
    # パスは外さずにそのまま渡す(サーバは --base-path /chat で頭の /chat を外す)。
    # timeout は Web のロングポーリング(最大30秒待つ)より長くする
    ProxyPass        http://127.0.0.1:8080/chat/ keepalive=On timeout=75
    ProxyPassReverse http://127.0.0.1:8080/chat/

    # 利用者から https で届いたかをサーバへ伝える(https なら Cookie に Secure が付く)。
    # 相手が送ってきた同名のヘッダは必ず上書きする(set)。
    # X-Forwarded-For は mod_proxy_http が自動で足す(サーバは --trust-proxy で一番右を見る)
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # 圧縮しない(pico-os は長さ付きの素の応答しか読まない。docs/spec/CHAT_PROTOCOL.md「トランスポート」)
    SetEnv no-gzip 1
</Location>

# ---- ここまで ----

# pico-os は TLS のハンドシェイクで1〜2秒画面が止まるので、接続を使い回せるようにしておく
# (既定の5秒だと、3秒ごとの取りに行く間に切れることがある)。VirtualHost の中に書いてもよい
KeepAlive On
KeepAliveTimeout 15
