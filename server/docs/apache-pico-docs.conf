# pico-os ドキュメントサーバ(Markdown ブラウザの相手)を Apache 2.4 の後ろに置き、
# https://example.com/docs/ として公開する設定の例。手順は server/docs/README.md。
#
# 使うモジュール:  sudo a2enmod proxy proxy_http headers
# 置き方: 既にある https の VirtualHost(<VirtualHost *:443>)の中へ、下の「ここから」〜「ここまで」を貼る
#   (Markdown ブラウザは平文の http:// でも読めるので、http の VirtualHost に貼ってもよい)
# 直したら:  sudo apachectl configtest && sudo systemctl reload apache2
#
# パスを /docs 以外にするなら、ここの /docs と pico-docs.service の --base-path を両方直す。

# ---- ここから ----

# サーバ情報。Markdown ブラウザは**ホストの頭の** /.well-known/pico-os を見に来る
# (docs/spec/PROTOCOL.md「サーバ情報」)。中の home・search・manifest はベースパス付きで返る。
# 1つのホストに置けるドキュメントサーバは1つだけ(この行が指す先)
ProxyPass        /.well-known/pico-os http://127.0.0.1:8090/docs/.well-known/pico-os
ProxyPassReverse /.well-known/pico-os http://127.0.0.1:8090/docs/.well-known/pico-os

# /docs だけで来たら /docs/ へ(文書の中の相対リンクが狂わないように)
RedirectMatch 301 ^/docs$ /docs/

<Location /docs/>
    # パスは外さずにそのまま渡す(サーバは --base-path /docs で頭の /docs を外す)
    ProxyPass        http://127.0.0.1:8090/docs/ timeout=30
    ProxyPassReverse http://127.0.0.1:8090/docs/
</Location>

<LocationMatch "^/(docs/|\.well-known/pico-os$)">
    # 圧縮しない(クライアントは gzip 等を解けない。docs/spec/PROTOCOL.md「トランスポート」)
    SetEnv no-gzip 1
    # 条件付きGET(If-None-Match → 304)が効くよう、ETag はサーバの付けたまま返す
    # (mod_deflate が動くと ETag に "-gzip" が付いて一致しなくなる。上の no-gzip で防ぐ)
</LocationMatch>

# ---- ここまで ----
